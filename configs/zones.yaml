# Restricted zones, per camera. Draw or edit them with: python scripts/draw_zones.py --camera <id>
# Corners are fractions (0-1) of the frame's width and height, so they survive a resolution change.
# Rules that use these zones (who may not enter, when, how urgent) are in configs/rules.yaml.

